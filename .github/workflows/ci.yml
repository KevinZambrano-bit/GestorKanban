# ============================================================================
#  Integración Continua (CI) — GestorKanban
#  UBICACIÓN EN EL REPO: .github/workflows/ci.yml
#  (crea la carpeta .github/workflows en la raíz y coloca este archivo dentro)
# ============================================================================
#
#  Valida automáticamente cada push a main y cada Pull Request hacia main.
#  Corre dos jobs en paralelo (backend y microservicio_ia). Si cualquiera
#  falla en lint, pruebas o build, el PR queda marcado en rojo y no debería
#  integrarse hasta corregirlo.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────
  #  Job 1: API principal
  # ─────────────────────────────────────────────────────────────────────
  backend:
    name: Backend · Lint + Tests + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 (con caché de dependencias)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (limpio y reproducible)
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npx eslint "{src,test}/**/*.ts"

      - name: Pruebas unitarias + cobertura
        run: npm test -- --ci --coverage

      - name: Compilar (verifica que el proyecto construye)
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────
  #  Job 2: Microservicio de IA
  # ─────────────────────────────────────────────────────────────────────
  microservicio-ia:
    name: Microservicio IA · Lint + Tests + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./microservicio_ia

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 (con caché de dependencias)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: microservicio_ia/package-lock.json

      - name: Instalar dependencias (limpio y reproducible)
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npx eslint "{src,test}/**/*.ts"

      - name: Pruebas unitarias
        run: npm test -- --ci --passWithNoTests

      - name: Compilar (verifica que el proyecto construye)
        run: npm run build